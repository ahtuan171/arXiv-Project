name: Milestone 1 report input checks

on:
  push:
    branches:
      - feat/m1-book-devops-prep
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S2_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test report contract
        run: python -m unittest discover -s book/tests -v
      - name: Validate notebook layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ("src/milestone1_pipeline.ipynb", "book/01_m1_crawling.ipynb"):
              obj = json.loads(Path(path).read_text(encoding="utf-8"))
              assert obj["nbformat"] == 4, path
              assert all("cell_type" in cell and "source" in cell for cell in obj["cells"])
              print("Notebook JSON valid:", path)
          PY
