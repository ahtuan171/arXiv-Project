name: Milestone 1 offline regression

on:
  push:
    branches:
      - feat/milestone1-compliance
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARXIV_DATA_DIR: "/tmp/m1-fixture-data-only"
      S2_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test M1 offline recovery and audit
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_version_downloader.py \
            tests/test_audit_version_downloads.py \
            tests/test_audit_legacy_matches.py \
            tests/test_audit_progress.py \
            tests/test_build_version_metadata.py \
            tests/test_raw_reference_collector.py \
            tests/test_audit_m1_integrity.py \
            tests/test_m1_offline_end_to_end.py \
            tests/test_build_m1_report.py \
            tests/test_notebook_layout.py \
            tests/test_notebook_presentation.py
      - name: Validate notebook JSON
        run: |
          python -c "import json; from pathlib import Path; n=json.loads(Path('src/milestone1_pipeline.ipynb').read_text()); assert n['nbformat']==4; assert sum(c['cell_type']=='code' for c in n['cells'])==7; print('code cells: 7')"
