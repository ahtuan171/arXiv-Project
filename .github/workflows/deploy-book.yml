name: Deploy Jupyter Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            book/requirements.txt

      - name: Install dependencies
        run: pip install -r book/requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build book
        run: jupyter-book build book --warningiserror

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    # Pull requests only check that the book builds; deployment happens from main.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
